<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<script>window.exports={};window.module={exports:window.exports};window.require=function(n){return ({react:window.React,'react-dom':window.ReactDOM})[n]||window.React;};</script>
<style>body{margin:0;background:var(--surface-page)}</style><script>(function(){var f=new URLSearchParams(location.search).get('theme');if(f==='dark')document.documentElement.setAttribute('data-theme','dark');if(!f)window.addEventListener('message',function(e){if(e.data&&e.data.kumoTheme)document.documentElement.setAttribute('data-theme',e.data.kumoTheme==='dark'?'dark':'');});})();</script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="../actions/Button.jsx"></script>
<script type="text/babel" src="./Dialog.jsx"></script>
<script type="text/babel" src="./Toast.jsx"></script>
<script type="text/babel" src="./Tooltip.jsx"></script>
<script type="text/babel">
const { Button, Dialog, Toast, Tooltip } = window.exports;
function Demo(){
  const [open, setOpen] = React.useState(false);
  const [toast, setToast] = React.useState(true);
  return <div style={{padding:20, display:'flex', flexDirection:'column', gap:16}}>
    <div style={{display:'flex', gap:12, alignItems:'center'}}>
      <Button variant="secondary" onClick={()=>setOpen(true)}>Open dialog</Button>
      <Tooltip content="Hover me — tooltip"><Button variant="ghost">Tooltip trigger</Button></Tooltip>
      {!toast && <Button variant="ghost" onClick={()=>setToast(true)}>Show toast again</Button>}
    </div>
    <div style={{display:'flex', flexDirection:'column', gap:8, alignItems:'flex-start'}}>
      <Toast open={toast} title="Render complete" description="delivery_v3.mov — 00:00:30" onClose={()=>setToast(false)} />
      <Toast tone="light" title="Draft saved" description="Autosaved to project." />
    </div>
    <Dialog open={open} onClose={()=>setOpen(false)} title="Delete render?" meta="C24015"
      footer={<React.Fragment><Button variant="secondary" onClick={()=>setOpen(false)}>Cancel</Button><Button onClick={()=>setOpen(false)}>Delete</Button></React.Fragment>}>
      This removes delivery_v3.mov from the queue. The source project is not affected.
    </Dialog>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
